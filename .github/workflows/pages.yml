name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          VITE_SUPABASE_URL: https://tqrrwrmqvgdxyfjbvwgh.supabase.co
          VITE_SUPABASE_PROJECT_ID: tqrrwrmqvgdxyfjbvwgh
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxcnJ3cm1xdmdkeHlmamJ2d2doIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyMDk0MDcsImV4cCI6MjA4Mjc4NTQwN30.5JmR1nTfHKoCI5UAvSLsoEPXYNuctCBrPGS5-k2aC10
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
